[project]
name = "hero"
version = "0.1.0"
description = "Local service that drafts 2D floor plans from OBJ, glTF, and IFC."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "python-multipart>=0.0.12",
  "trimesh>=4.5.0",
  "numpy>=2.0.0",
  "pyclipr>=0.1.0",
  "ifcopenshell>=0.8.0",
  "reportlab>=4.2.0",
  "pydantic>=2.9.0",
  "laspy>=2.7.0",
  "pye57>=0.4.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[project.scripts]
hero = "hero.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
